<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise 2.1 – Leadership Akademie</title>
  <meta name="description" content="Mise 2.1 Leadership Akademie – trénink vedení s AI avatarem.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<!-- Obsah mise se bere z missions.js podle data-mission. Needituj texty tady. -->
<body data-mission="2.1">
  <div class="app-shell">
    <header>
      <div class="brand">
        <img class="brand-logo" src="img/jakpoint-logo.png" alt="JAKpoint" width="320" height="219">
        <div class="brand-text">
          <h1 class="brand-title">Leadership Akademie</h1>
          <p class="brand-subtitle" id="brandSubtitle"></p>
        </div>
      </div>
      <div class="header-meta">
        <span class="pill pill-bonus" id="bonusPill" hidden>Bonusová mise</span>
      </div>
    </header>

    <main class="mission-page">
      <section class="card" aria-labelledby="missionHeading">
        <h2 class="panel-title" id="missionHeading">Zadání mise</h2>
        <p class="mission-name" id="missionName"></p>
        <p class="mission-goal" id="missionGoal"></p>
        <p class="mission-tip">
          <span class="mission-tip-label">Tip</span>
          <span id="missionTip"></span>
        </p>

        <div class="video-container">
          <iframe
            id="avatarFrame"
            allow="microphone"
            title="AI avatar"
            loading="lazy"
          ></iframe>
        </div>
      </section>

      <section class="card" aria-labelledby="evalHeading">
        <h2 class="panel-title" id="evalHeading">Vyhodnocení mise</h2>
        <div class="status-controls">
          <div class="status-buttons">
            <button type="button" class="btn" id="btnDone" aria-pressed="false">Splnil jsem</button>
            <button type="button" class="btn" id="btnFailed" aria-pressed="false">Nesplnil jsem</button>
          </div>

          <p class="status-info" id="statusInfo"></p>

          <p class="status-label" role="status" aria-live="polite">
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <span id="statusText">Mise zatím není označena.</span>
          </p>

          <div class="mission-actions">
            <a class="btn btn-secondary" href="index.html">Zpět na šachovnici</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Leadership Akademie – gamifikovaný trénink pro ředitele škol</span>
      <span id="footerMission"></span>
    </footer>
  </div>

  <script src="missions.js"></script>
  <script src="progress.js"></script>
  <script src="mission.js"></script>
</body>
</html>
